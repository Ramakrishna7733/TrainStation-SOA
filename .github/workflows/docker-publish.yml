
name: Build and Publish TrainStation Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: TrainStation/pom.xml

      - name: Build backend JAR
        working-directory: TrainStation
        run: mvn --batch-mode clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./TrainStation
          push: true
          tags: ramakrishna7733/docker-backend-2400031163:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./trainstation-frontend
          push: true
          tags: ramakrishna7733/docker-frontend-2400031163:latest
